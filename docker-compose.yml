# The full distributed platform on one machine:
#
#   docker compose up --build
#
#   API gateway ....... http://localhost:8080/docs
#   Lambda emulator ... http://localhost:9000  (Stripe webhooks, telemetry beacon)
#   Jaeger (traces) ... http://localhost:16686
#   Prometheus ........ http://localhost:9090
#   Grafana ........... http://localhost:3000  (anonymous viewer access)
#
# For a no-Docker setup run `uv run devstack serve` instead.

name: ainative

x-build: &build
  context: .
  dockerfile: infra/docker/service.Dockerfile

x-common-env: &common-env
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379/0
  INTERNAL_JWT_SECRET: local-compose-internal-secret-0123456789abcdef
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 12

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------- gateway
  gateway:
    <<: *service
    build: {<<: *build, args: {PACKAGE: gateway-service, SOURCE_DIR: services/gateway}}
    image: ainative/gateway:local
    command: ["api", "--port", "8000"]
    environment: &gateway-env
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/gateway
      JWT_SECRET: local-compose-user-jwt-secret-0123456789abcdef
      STAFF_EMAILS: staff@ainative.dev
      KNOWLEDGE_URL: http://knowledge:8000
      AGENTS_URL: http://agents:8000
      BILLING_URL: http://billing:8000
      GROWTH_URL: http://growth:8000
    ports: ["8080:8000"]
    healthcheck: *api-healthcheck

  gateway-worker:
    <<: *service
    build: {<<: *build, args: {PACKAGE: gateway-service, SOURCE_DIR: services/gateway}}
    image: ainative/gateway:local
    command: ["worker"]
    environment: *gateway-env

  # ------------------------------------------------------------- knowledge
  knowledge:
    <<: *service
    build: {<<: *build, args: {PACKAGE: knowledge-service, SOURCE_DIR: services/knowledge}}
    image: ainative/knowledge:local
    command: ["api", "--port", "8000"]
    environment: &knowledge-env
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/knowledge
      KNOWLEDGE_EMBEDDER: ${KNOWLEDGE_EMBEDDER:-hashing}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    healthcheck: *api-healthcheck

  knowledge-worker:
    <<: *service
    build: {<<: *build, args: {PACKAGE: knowledge-service, SOURCE_DIR: services/knowledge}}
    image: ainative/knowledge:local
    command: ["worker"]
    environment: *knowledge-env

  # ---------------------------------------------------------------- agents
  agents:
    <<: *service
    build: {<<: *build, args: {PACKAGE: agents-service, SOURCE_DIR: services/agents}}
    image: ainative/agents:local
    command: ["api", "--port", "8000"]
    environment: &agents-env
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/agents
      KNOWLEDGE_URL: http://knowledge:8000
      BILLING_URL: http://billing:8000
      # For the Anthropic API set AGENTS_LLM_PROVIDER=anthropic, ANTHROPIC_API_KEY and
      # AGENTS_MODEL (the model id to use).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTS_LLM_PROVIDER: ${AGENTS_LLM_PROVIDER:-offline}
      AGENTS_MODEL: ${AGENTS_MODEL:-}
    healthcheck: *api-healthcheck

  agents-worker:
    <<: *service
    build: {<<: *build, args: {PACKAGE: agents-service, SOURCE_DIR: services/agents}}
    image: ainative/agents:local
    command: ["worker"]
    environment: *agents-env

  # --------------------------------------------------------------- billing
  billing:
    <<: *service
    build: {<<: *build, args: {PACKAGE: billing-service, SOURCE_DIR: services/billing}}
    image: ainative/billing:local
    command: ["api", "--port", "8000"]
    environment: &billing-env
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/billing
    healthcheck: *api-healthcheck

  billing-worker:
    <<: *service
    build: {<<: *build, args: {PACKAGE: billing-service, SOURCE_DIR: services/billing}}
    image: ainative/billing:local
    command: ["worker"]
    environment: *billing-env

  # ---------------------------------------------------------------- growth
  growth:
    <<: *service
    build: {<<: *build, args: {PACKAGE: growth-service, SOURCE_DIR: services/growth}}
    image: ainative/growth:local
    command: ["api", "--port", "8000"]
    environment: &growth-env
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/growth
    healthcheck: *api-healthcheck

  growth-worker:
    <<: *service
    build: {<<: *build, args: {PACKAGE: growth-service, SOURCE_DIR: services/growth}}
    image: ainative/growth:local
    command: ["worker"]
    environment: *growth-env

  # ------------------------------------------- serverless (Lambda emulator)
  functions:
    build: {<<: *build, args: {PACKAGE: serverless-functions, SOURCE_DIR: services/serverless}}
    image: ainative/functions:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_compose}
      PORT: "9000"
    ports: ["9000:9000"]

  # ---------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.1.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
  redisdata:
