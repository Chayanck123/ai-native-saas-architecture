[project]
name = "serverless-functions"
version = "0.1.0"
description = "AWS Lambda handlers: Stripe webhook ingestion, edge telemetry beacon and scheduled jobs"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
]

[project.scripts]
serverless-functions = "serverless_functions.local:main"

[tool.uv.sources]
platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serverless_functions"]
