[project]
name = "billing-service"
version = "0.1.0"
description = "Usage-based monetization: metering, credit ledger, entitlements, plans, invoices and ARR / MRR analytics"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
]

[project.scripts]
billing-service = "billing_service.__main__:main"

[tool.uv.sources]
platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_service"]
