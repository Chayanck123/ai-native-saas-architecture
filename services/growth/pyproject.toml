[project]
name = "growth-service"
version = "0.1.0"
description = "Growth analytics: real-time telemetry, funnels, cohorts, attribution, LTV:CAC, automated A/B testing and PQL scoring"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
]

[project.scripts]
growth-service = "growth_service.__main__:main"

[tool.uv.sources]
platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growth_service"]
