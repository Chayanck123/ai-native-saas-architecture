[project]
name = "gateway-service"
version = "0.1.0"
description = "Public API edge: authentication, tenants, members, API keys, RBAC, rate limiting, idempotency, routing and outbound webhooks"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
]

[project.scripts]
gateway-service = "gateway_service.__main__:main"

[tool.uv.sources]
platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_service"]
