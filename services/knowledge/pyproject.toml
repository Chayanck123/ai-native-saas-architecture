[project]
name = "knowledge-service"
version = "0.1.0"
description = "Retrieval-augmented generation: document ingestion, chunking, vector embeddings and hybrid (dense + BM25) search"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "numpy>=1.26",
    "pgvector>=0.3",
]

[project.scripts]
knowledge-service = "knowledge_service.__main__:main"

[tool.uv.sources]
platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]
