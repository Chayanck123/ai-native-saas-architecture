# Cluster-wide, so every namespace (ainative, ainative-staging) can use it. No
# credentials here: the operator authenticates with its own IAM role (IRSA),
# which may read only the platform's secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
