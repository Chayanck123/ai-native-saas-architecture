apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ainative-staging
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: ainative
    patch: |
      - op: replace
        path: /metadata/name
        value: ainative-staging
  - target:
      kind: ConfigMap
      name: platform-config
    patch: |
      - op: replace
        path: /data/ENVIRONMENT
        value: staging
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: Ingress
      name: public-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.example.com
# The CD pipeline pins every image to the commit being deployed, e.g.:
#   kustomize edit set image ainative/gateway=<registry>/ainative/gateway:<sha>
images:
  - name: ainative/gateway
    newTag: latest
