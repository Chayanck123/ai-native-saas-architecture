global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # HTTP APIs expose /metrics on their API port.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000", "knowledge:8000", "agents:8000", "billing:8000", "growth:8000"]
        labels:
          role: api

  # Workers expose task, queue and LLM metrics on their metrics port.
  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway-worker:9100
          - knowledge-worker:9100
          - agents-worker:9100
          - billing-worker:9100
          - growth-worker:9100
        labels:
          role: worker
