# Continuous delivery for the services: every commit on main is tested, built
# once, deployed to staging, then promoted - the very same images - to
# production after the "production" environment's reviewers approve.
#
#   CI -> publish images (GHCR) -> staging -> production (canary gateway)
#
# Infrastructure changes go through infra.yml; setup is in docs/runbook.md.
# The AWS deploys stay off (skipped, not failed) until the repository variable
# ENABLE_AWS_DEPLOYMENTS is set to true at the end of that setup.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One delivery at a time. A newer commit waits; queued intermediate ones are skipped.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Publish ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, knowledge, agents, billing, growth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (registry paths are lower-case)
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: |
            PACKAGE=${{ matrix.service }}-service
            SOURCE_DIR=services/${{ matrix.service }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          # Supply-chain metadata: SLSA provenance and an SBOM travel with the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  staging:
    name: Staging
    needs: images
    if: vars.ENABLE_AWS_DEPLOYMENTS == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    permissions:
      contents: read
      id-token: write
      packages: read

  production:
    name: Production
    needs: staging
    if: vars.ENABLE_AWS_DEPLOYMENTS == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
