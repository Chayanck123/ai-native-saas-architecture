# Deploys one commit's images to one environment (called by cd.yml).
#
# The job runs in the GitHub environment of the same name. That is where
# protection rules apply (required reviewers for production), and only jobs in
# it can assume the environment's AWS role (infra/terraform/modules/github).
# Environment variables: AWS_REGION, AWS_ROLE_ARN, EKS_CLUSTER and optionally
# PUBLIC_API_URL - the `github_environments` Terraform output lists them.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    # Production's canary alone pauses 25 minutes between traffic steps.
    timeout-minutes: 90
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_API_URL }}
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for AWS credentials
      packages: read # pull the images published by cd.yml
    env:
      OVERLAY: ${{ inputs.environment }}
      NAMESPACE: ${{ inputs.environment == 'production' && 'ainative' || format('ainative-{0}', inputs.environment) }}
      # Terraform names the EKS and Aurora clusters alike: ainative-<environment>.
      CLUSTER: ${{ vars.EKS_CLUSTER }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-k8s-tools

      - name: AWS credentials (OIDC, no stored keys)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Log in to GitHub's registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote this commit's images into the environment's ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: scripts/deploy/promote-images.sh "$SHA" "ghcr.io/${GITHUB_REPOSITORY,,}" "$REGISTRY"

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Create or update the services' databases and logins
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: >-
          scripts/deploy/bootstrap-databases.sh "$NAMESPACE" "$REGISTRY/ainative/gateway:$SHA"
          "$CLUSTER" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Apply the manifests
        id: apply
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: scripts/deploy/apply-manifests.sh "$OVERLAY" "$REGISTRY" "$SHA" "$ACCOUNT_ID"

      - name: Wait for the rollout (canary analysis in production)
        run: scripts/deploy/wait-for-rollout.sh "$NAMESPACE"

      - name: Smoke test through the public load balancer
        if: vars.PUBLIC_API_URL != ''
        env:
          URL: ${{ vars.PUBLIC_API_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$URL/readyz"

      - name: Roll back the Deployments
        if: failure() && steps.apply.outcome == 'success'
        run: scripts/deploy/rollback.sh "$NAMESPACE"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### ${OVERLAY}: ${STATUS}"
            echo "Commit \`${SHA}\` in namespace \`${NAMESPACE}\` of cluster \`${CLUSTER}\`."
          } >> "$GITHUB_STEP_SUMMARY"
