# Quality gates for every pull request; cd.yml runs them again on main before
# anything is built or deployed.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: make lint
      - run: make typecheck

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: Unit and in-process tests (SQLite, in-memory bus)
        run: uv run pytest

  integration:
    name: Integration and distributed smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The services' unprivileged role, so row-level security is really enforced.
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: Create the least-privilege role and databases
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f infra/docker/postgres-init.sql
      - name: Tests against PostgreSQL (RLS, pgvector) and Redis
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Distributed smoke test (every service as its own process)
        env:
          REDIS_URL: redis://localhost:6379/14
        run: uv run python scripts/smoke_distributed.py

  images:
    name: Image (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: gateway, package: gateway-service, source: services/gateway, module: gateway_service }
          - { name: knowledge, package: knowledge-service, source: services/knowledge, module: knowledge_service }
          - { name: agents, package: agents-service, source: services/agents, module: agents_service }
          - { name: billing, package: billing-service, source: services/billing, module: billing_service }
          - { name: growth, package: growth-service, source: services/growth, module: growth_service }
          - { name: functions, package: serverless-functions, source: services/serverless, module: serverless_functions }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: |
            PACKAGE=${{ matrix.image.package }}
            SOURCE_DIR=${{ matrix.image.source }}
          tags: ainative/${{ matrix.image.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: The image imports its service and runs as the unprivileged user
        env:
          IMAGE: ainative/${{ matrix.image.name }}:ci
          MODULE: ${{ matrix.image.module }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import os, ${MODULE}; assert os.getuid() == 10001, os.getuid()"

  lambda:
    name: Lambda bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Build the bundle for the Lambda runtime and import every handler
        run: make package-lambdas

  infrastructure:
    name: Infrastructure as code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Terraform format and validate
        run: make tf-validate
      - uses: ./.github/actions/setup-k8s-tools
      - name: Kubernetes manifests against the API and CRD schemas
        run: make k8s-validate
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/service.Dockerfile
      - name: Docker Compose file
        run: docker compose config --quiet
      - name: Workflow lint (actionlint + shellcheck)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck scripts/deploy/*.sh
