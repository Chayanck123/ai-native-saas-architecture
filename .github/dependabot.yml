# Weekly, grouped dependency updates; each arrives as a pull request that CI tests.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories: ["/infra/terraform", "/infra/terraform/modules/*"]
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
